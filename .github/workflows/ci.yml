name: cross-platform-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install Linux Electron libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xdg-utils \
            libatspi2.0-0 libdrm2 libgbm1 build-essential
          sudo apt-get install -y libasound2 || sudo apt-get install -y libasound2t64

      - name: Install app dependencies
        run: bun install --frozen-lockfile

      - name: Prepare pinned runtime and extensions
        run: bun run setup

      - name: Check runtime bundle drift
        run: bun run check:bundle

      - name: Typecheck
        run: bun run typecheck

      - name: Unit and smoke tests
        run: bun test

      - name: Build Electron app
        run: bun run build

      - name: Validate packaged content
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: bun x electron-builder --config electron-builder.yml --dir --publish never
