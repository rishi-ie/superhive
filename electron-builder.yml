appId: com.superhive.app
productName: Superhive
directories:
  output: release
  buildResources: build
files:
  - dist
  - dist-electron
asar: true
afterPack: build/after-pack.cjs
extraResources:
  - from: resources
    to: .
  - from: runtime
    to: runtime
  - from: .runtime/general-kai
    to: runtime/general-kai
  - from: .runtime/extensions
    to: runtime/extensions
mac:
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
win:
  target:
    - nsis
    - portable
linux:
  target:
    - AppImage
    - deb
  category: Utility
